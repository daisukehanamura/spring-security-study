<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>ログイン</title></head>
<body>
<h1>ログイン</h1>
<p th:if="${param.error}" style="color:red">ユーザー名またはパスワードが違います。</p>
<form th:action="@{/login}" method="post">
  <div><label>ユーザー名 <input type="text" name="username" autofocus></label></div>
  <div><label>パスワード <input type="password" name="password"></label></div>
  <button type="submit">ログイン</button>
</form>
<p><a th:href="@{/}">トップへ</a></p>
</body>
</html>
